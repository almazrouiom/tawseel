{% extends "admin/base.html" %}
{% from "_macros.html" import icon %}
{% block admin_content %}
<div class="admin-page-head">
  <div>
    <span class="eyebrow">الأمان</span>
    <h2>تغيير كلمة المرور</h2>
    <p>استخدم كلمة مرور طويلة وفريدة لحساب المدير.</p>
  </div>
</div>

<div class="narrow-panel">
  <form method="post" class="panel stack-form" data-loading>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="current-password">كلمة المرور الحالية</label>
      <input id="current-password" name="current_password" type="password" required autocomplete="current-password" dir="ltr">
    </div>
    <div class="field">
      <label for="new-password">كلمة المرور الجديدة</label>
      <input id="new-password" name="new_password" type="password" required minlength="10" autocomplete="new-password" dir="ltr">
      <small class="field-hint">10 أحرف على الأقل. يُفضل استخدام عبارة مرور طويلة.</small>
    </div>
    <div class="field">
      <label for="confirm-password">تأكيد كلمة المرور</label>
      <input id="confirm-password" name="confirm_password" type="password" required minlength="10" autocomplete="new-password" dir="ltr">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">{{ icon('lock', 17) }} تحديث كلمة المرور</button>
      <a class="btn btn-ghost" href="{{ url_for('admin.dashboard') }}">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
