<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }} | {{ settings.company_name }}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='media/logos/favicon-32x32.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='local/site.css') }}">
</head>
<body class="error-body">
  <main class="error-shell">
    <a class="error-brand" href="{{ url_for('public.home') }}">
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4.3 7.7 7.7 4.4 7.7-4.4"/><path d="M12 12.1V21"/><path d="m8 5.2 8 4.5"/></svg>
      <span>{{ settings.company_name }}</span>
    </a>
    <div class="error-code">{{ status }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="error-actions">
      <a class="btn btn-primary" href="{{ url_for('public.home') }}">العودة إلى الرئيسية</a>
      <a class="btn btn-ghost" href="{{ url_for('public.track') }}">تتبع شحنة</a>
    </div>
    <small class="error-foot">إذا استمرت المشكلة، تواصل مع <a href="{{ url_for('public.contact') }}">فريق توصيل</a>.</small>
  </main>
</body>
</html>
